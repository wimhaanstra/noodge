name: Release

# Only a tag releases. Ordinary commits to main run CI and nothing else, so
# pushing work in progress can never publish anything.
#
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, so it needs the whole history and the tags themselves. The
          # default shallow checkout leaves it with neither.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # A tag that does not build is a tag that has to be deleted, and a
      # deleted tag is confusing for anyone who already fetched it. Checking
      # first costs a minute.
      - name: Test before releasing
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the Scoop manifest writes to a different repository,
          # which the built-in token cannot do. If this secret is not set the
          # release still succeeds and simply skips Scoop.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  # The site carries the update feed, which has to describe the release that
  # was just published. It is called rather than triggered: a "release
  # published" event raised with the built-in GITHUB_TOKEN does not start a
  # workflow run, so waiting for one would wait forever.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
