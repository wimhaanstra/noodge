name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target, so it is not an afterthought here.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The race detector needs cgo, so it is not available on every
      # developer machine. Run it on one platform rather than making a C
      # toolchain a prerequisite for contributing.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # The install scripts are the first thing a new user runs, and they are
      # not covered by the Go tests at all.
      - name: shellcheck the installer
        run: shellcheck --shell=sh scripts/install.sh

      - name: PowerShell installer parses
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'install.ps1 parses cleanly'

      - name: Schema is up to date
        # The schema is generated from the doc comments in internal/config and
        # committed. If a comment changed without regenerating, say so here
        # rather than shipping a schema that describes the previous version.
        run: |
          go run ./tools/gen-schema
          if ! git diff --exit-code internal/schema/noodge.schema.json; then
            echo
            echo "The committed schema is stale. Run: go run ./tools/gen-schema"
            exit 1
          fi
